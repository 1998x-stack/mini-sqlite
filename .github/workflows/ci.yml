name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Smoke example
        run: python examples/quickstart.py
      - name: Smoke transactions
        run: python examples/transactions.py
      - name: Smoke indexes
        run: python examples/indexes.py
      - name: Smoke relational engine
        run: python examples/relational.py
      - name: Smoke joins
        run: python examples/joins.py
      - name: Smoke WAL
        run: python examples/wal.py
      - name: Smoke buffer pool
        run: python examples/buffer_pool.py
      - name: Smoke optimizer
        run: python examples/optimizer.py
      - name: Smoke concurrency
        run: python examples/concurrency.py
      - name: Smoke lifecycle maintenance
        run: python examples/lifecycle.py
      - name: Smoke cross-process locking
        run: python examples/cross_process.py
      - name: Smoke free-list reuse
        run: python examples/freelist.py
      - name: Smoke ordered range indexes
        run: python examples/range_indexes.py
      - name: Compile package
        run: python -m compileall -q mini_sqlite

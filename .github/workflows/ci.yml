name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Smoke example
        run: python examples/quickstart.py
      - name: Smoke transactions
        run: python examples/transactions.py
      - name: Smoke indexes
        run: python examples/indexes.py
      - name: Smoke relational engine
        run: python examples/relational.py
      - name: Smoke joins
        run: python examples/joins.py
      - name: Compile package
        run: python -m compileall -q mini_sqlite
